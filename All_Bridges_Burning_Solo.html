<script>'use strict';
(() => {
const modules={
"actions.js": function(require) {
const {FACTIONS, NAME, NEAR, RAIL, capabilityName, edge, spaceName}=require("data.js");
const {addNews, capacity, cells, clamp, cleanSpace, clone, countTerror, flip, human, newsAt, pay, pools}=require("model.js");
const {chooseSpaceRanked, pick, roll}=require("random.js");

const enemy = f=>FACTIONS.filter(other=>other!==f);
function createMoveState() {
  return {fromUsed:new Set(),toUsed:new Set(),movedInto:{}};
}
const unmovedCount = (b,movedInto,id,key)=>Math.max(0,b[key]-(movedInto?.[id]?.[key]??0));
const unmovedCells = (b,movedInto,id,f='m')=>unmovedCount(b,movedInto,id,f+'A')+unmovedCount(b,movedInto,id,f+'I');
function unmovedCapabilities(b,movedInto,id,f) {
  const arrivals={...movedInto?.[id]?.capabilities};
  return b.caps[f].filter(cap=>{
    if(!arrivals[cap]) return true;
    arrivals[cap]--;
    return false;
  });
}
function recordMovedInto(movedInto,id,key,count=1) {
  if(count<=0) return;
  const arrivals=movedInto[id]??={};
  arrivals[key]=(arrivals[key]??0)+count;
}
function recordGroupMove(tracker,from,to,{allowMultipleGroups=false}={}) {
  if(!allowMultipleGroups&&[from,to].some(id=>tracker.fromUsed.has(id)||tracker.toUsed.has(id))) {
    throw Error('Enter each movement group once and use each destination once. Record mixed or converging groups in the tabletop editor.');
  }
  tracker.fromUsed.add(from);
  tracker.toUsed.add(to);
}
function rallySize(b,f,offset=false) {
  const bonus=f==='r'?-b.support:f==='s'?b.support:0;
  const modifier=f==='m'?Math.abs(b.support):Math.max(0,-bonus)+b[f==='r'?'sTerror':'rTerror'];
  const positive=f==='m'?0:Math.max(0,bonus);
  return {n:Math.max(0,1+positive-modifier+(offset===true?modifier:offset)),modifier};
}
function placeCells(g,id,f,n,active=false) {
  const amount=Math.min(n,pools(g)[f]);
  if(amount>0) g.board[id][f+(active?'A':'I')]+=amount;
  return amount;
}
function removeCells(g,id,f,n,activeFirst=true) {
  const b=g.board[id];
  const first=f+(activeFirst?'A':'I'), second=f+(activeFirst?'I':'A');
  const a=Math.min(b[first],n);
  const c=Math.min(b[second],n-a);
  b[first]-=a;
  b[second]-=c;
  return a+c;
}
function replaceWithDisc(g,id,f,relocate=null) {
  const b=g.board[id], key=f==='r'?'admin':'network';
  if(cells(b,f)<2||capacity(b)<=0||(!human(g,f)&&b[key])) return false;
  if(!pools(g)[key]) {
    if(f!=='r'||!relocate||relocate===id||g.board[relocate].admin<1) return false;
    g.board[relocate].admin--;
  }
  removeCells(g,id,f,2,f==='m');
  b[key]++;
  cleanSpace(g,id);
  return true;
}
function rallyPlace(g,id,f,{free=false,offset=0}={}) {
  const b=g.board[id];
  const {n,modifier}=rallySize(b,f,free||!human(g,f)?true:offset);
  if(n===0||pools(g)[f]===0) return 0;
  pay(g,f,1+Math.min(offset,modifier),free);
  return placeCells(g,id,f,n);
}
function terrorOptions(g,id,f,{inactive=false,cap=null,polarization=g.tracks.pol}={}) {
  const b=g.board[id];
  if(inactive?!cells(b,f):!b[f+'A']) return [];
  const limit=cap??(polarization>=6?2:1), out=[];
  for(const targets of [[...enemy(f).slice(0,1)],[...enemy(f).slice(1)],enemy(f),[...enemy(f)].reverse()]) {
    for(const preference of [true,false]) {
      const simulation=clone(b), removed=[];
      for(const side of targets) {
        const preferActive=side==='m'?!preference:preference;
        const first=side+(preferActive?'A':'I');
        const second=side+(preferActive?'I':'A');
        for(const key of [first,second]) while(simulation[key]>0&&removed.length<limit&&
          !(cells(simulation,side)===1&&(simulation[side+'Prep']||simulation.caps[side]?.length))) {
          simulation[key]--;
          removed.push(key);
        }
        const disc=side==='r'?'admin':side==='m'?'network':null;
        if(cap===null&&disc&&!cells(simulation,side)) while(simulation[disc]>0&&removed.length<limit) {
          simulation[disc]--;
          removed.push(disc);
        }
      }
      if(removed.length&& !out.some(item=>JSON.stringify(item.removed)===JSON.stringify(removed))) out.push({removed,simulation});
    }
  }
  return out;
}
function terrorAt(g,id,f,choice,{free=false,holdPol=false}={}) {
  pay(g,f,1,free);
  const b=g.board[id], added=countTerror(b)<2&&pools(g)[f+'Terror']>0;
  for(const key of choice.removed) b[key]--;
  cleanSpace(g,id,{reason:'terror',actor:f});
  if(added) {
    b[f+'Terror']++;
    if(g.phase===2&&countTerror(b)===2) addNews(g,id);
    if(!holdPol) g.tracks.pol=clamp(g.tracks.pol+1,0,10);
  }
  return Number(added);
}
function cubeColor(g,log,policy='non-player') {
  const p=pools(g), choices=['r','s'].filter(f=>p[f+'C']>0);
  if(choices.length<2) return choices[0];
  if(policy==='equal') return pick(g,choices);
  const value=roll(g,log,'Political cube');
  if(value<5) return value<3?'r':'s';
  return pick(g,choices.filter(f=>!human(g,f)).length?choices.filter(f=>!human(g,f)):choices);
}
function putCube(g,side) {
  if(!['r','s'].includes(side)||pools(g)[side+'C']<=0||g.issues.every(Boolean)) return false;
  g.tracks[side+'C']++;
  return true;
}
function politicalCubeChoices(g) {
  if(g.issues.every(Boolean)) return [];
  const available=pools(g);
  return ['r','s'].filter(side=>available[side+'C']>0);
}
function legalRail(g,from,to) {
  return RAIL.includes(edge(from,to))&&!g.sabotage.includes(edge(from,to));
}
function carryNews(g,f,from,to) {
  const remaining=cells(g.board[from],f);
  for(const token of newsAt(g,from,f).slice(remaining)) token.space=to;
}
function travel(g,f,from,to,opts,tracker=null) {
  const b=g.board[from], d=g.board[to], count=opts.count;

    return pop(id)>0&&(cells(b,'m')||b.network);
  });
  const yieldOf=id=>{
    const b=g.board[id];
    return Number(town(id))+2*Math.min(b.mI,Number(b.person)+Number(b.network>0));
  };
  const max=choices.map(yieldOf).sort((a,b)=>b-a).slice(0,2).reduce((sum,n)=>sum+n,0);
  if(!max||max<min) return false;
  const selected=[];
  for(let i=0;i<2;i++) {
    const id=placeRanked(g,choices.filter(id=>!selected.includes(id)&&yieldOf(id)>0),id=>[-yieldOf(id)],null);
    if(id) selected.push(id);
  }
  const earned=selected.reduce((n,id)=>n+yieldOf(id),0);
  for(const id of selected) {
    const b=g.board[id];
    flip(b,'m',true,Number(b.person)+Number(b.network>0));
  }

  log.push('Publish · '+selected.map(spaceName).join(', ')+' yields '+earned+' Resources before the track cap.');

}
function dialogue(g,log) {
  const s=score(g), available=pools(g).m;
  const targets=[];
  for(const id of SPACE_IDS) {
    const b=g.board[id];
    if(!b.mI) continue;
    if(b.support!==0) targets.push({id,side:null,urgent:b.support<0&&s.opp>=10?pop(id):0,kind:Math.abs(b.support)===2?2:3});
    if(available) for(const side of ['r','s']) {
      if(!b[side+'I']||cells(b,side)===1&&(b.caps[side].length||b[side+'Prep']||newsAt(g,id,side).length)) continue;
      const urgent=side==='s'&&s.senate>=4&&town(id)&&control(b)==='s'&&control({...b,sI:b.sI-1,mI:b.mI+1})!=='s'?pop(id):0;
      targets.push({id,side,urgent,kind:1});
    }
  }
  const choices=targets.filter(x=>x.urgent||x.kind<3);
  const target=chooseSpaceRanked(g,choices,x=>{
    const b=g.board[x.id];
    return [-x.urgent,x.urgent?-Number(x.side?human(g,x.side):human(g,'r')):x.kind,-Number(Boolean(b.network||b.person)),-Number(x.kind===1&&town(x.id))];
  },log,'Dialogue',x=>spaceName(x.id)+(x.side?' · replace '+NAME[x.side]:' · move toward Neutral'),x=>x.id);
  if(!target) return false;
  const b=g.board[target.id];
  flip(b,'m',true);
  if(target.side) {
    b[target.side+'I']--;
    b.mI++;
  } else b.support-=Math.sign(b.support);
  return true;
}

return {placeRanked,nearest,botRally,prepare,foreign,crackdownSpaces,crackdown,botPersonality,publish,dialogue};
},
"bots.js": function(require) {
const {BOT_CARD, EVENTS, NAME, eventName, spaceName}=require("data.js");
const {clone}=require("model.js");

const {actor, finishTurn, left, options, record}=require("sequence.js");

const {botPersonality, botRally, crackdown, dialogue, foreign, prepare, publish}=require("bot-rally.js");

const {autoEvent, eventSides, eventTag, manualEvent, preferredCapability}=require("events.js");

const CARD_IDS = Object.keys(BOT_CARD).map(Number);
function senateManeuver(g,card,limit,log,allowLimited) {
  const limited=limit===1;
  const candidate=limited?g:clone(g), steps=[];
  const special=!limited&&prepare(candidate,'s',steps,{repairOnly:true})?'Prepare':null;
  if(!limited&&!special) {
    if(allowLimited===false) return {n:0,reason:'Needs Prepare and the Limited Command box is occupied'};
    steps.push('Prepare is unavailable. Use the available Limited Command.');
  }
  const command=card===58?botAttack:botMarch;
  const n=command(candidate,'s',special?limit:1,steps);
  if(!n) return {n:0,reason:'No legal target for the Command'};
  if(!limited) Object.assign(g,candidate);

}
function executeBotCard(g,f,card,limit,log,context={}) {
  const condition=context.condition??botCondition(g,card,log);
  if(!condition.ok) return {n:0,reason:'Condition not met'};
  if(card===58||card===59) return senateManeuver(g,card,limit,log,context.allowLimited);
  const limited=limit===1;
  let n=0;
  if([48,54,55,60].includes(card)) {
    limit=Math.min(limit,card===60?2+Math.max(0,g.tracks.pol-5):3);
    n=botRally(g,f,card,limit,log,context);
  }
  if([49,50,56].includes(card)) n=botActivism(g,f,card,limited,log,condition.die);
  if([51,57].includes(card)) n=botTerror(g,f,Math.min(2,limit),log);
  if(card===52) n=botAttack(g,f,limit,log);
  if(card===53) n=botMarch(g,f,limit,log);
  if(card===61) n=botNegotiate(g,limit,log);
  if([62,63].includes(card)) n=botMessage(g,card,Math.min(3,limit),log);
  if(card===64&&putCube(g,cubeColor(g,log))) {
    log.push('Politics · Place an available political cube.');
    n=1;
  }
  if(!n) return {n:0,reason:'No legal target for the Command'};
  if(limited) return {n,special:null,onlyLimited:true};
  const activities={
    48:[['Prepare',()=>prepare(g,f,log)]],
    49:[['Foreign Relations',()=>foreign(g,f,log)],['Prepare',()=>prepare(g,f,log)]],
    50:[['Prepare',()=>prepare(g,f,log)]],
    51:[['Foreign Relations',()=>foreign(g,f,log)],['Prepare',()=>prepare(g,f,log)]],
    52:[['Prepare',()=>prepare(g,f,log)]],53:[['Prepare',()=>prepare(g,f,log)]],
    54:[['Foreign Relations',()=>foreign(g,f,log)],['Prepare',()=>prepare(g,f,log)]],
    55:[['Crackdown',()=>crackdown(g,log)],['Foreign Relations',()=>foreign(g,f,log)]],
    56:[['Foreign Relations',()=>foreign(g,f,log)],['Crackdown',()=>crackdown(g,log)],['Prepare',()=>prepare(g,f,log)]],
    57:[['Foreign Relations',()=>foreign(g,f,log)],['Crackdown',()=>crackdown(g,log)],['Prepare',()=>prepare(g,f,log)]],
    60:[['Personality',()=>botPersonality(g,log)]],61:[['Dialogue',()=>dialogue(g,log)]],
    62:[['Dialogue',()=>dialogue(g,log)],['Publish',()=>publish(g,log)]],
    63:[['Publish',()=>publish(g,log,4)],['Dialogue',()=>dialogue(g,log)]],
    64:[['Publish',()=>publish(g,log,4)],['Personality',()=>botPersonality(g,log)],['Dialogue',()=>dialogue(g,log)]]
  };
  const special=activities[card]?.find(([,run])=>run())?.[0]??null;

}
function botDraw(g,f,limit,log,context={}) {
  const cards=context.cards??shuffle(g,CARD_IDS.filter(id=>BOT_CARD[id][0]===f));
  for(const id of cards) {
    const info=BOT_CARD[id], tentative=clone(g), local=[];
    const condition=context.condition??botCondition(tentative,id,local);
    const conditionLog=local.length, conditionRng=tentative.rng;
    const output=executeBotCard(tentative,f,id,limit,local,{...context,condition});
    g.rng=tentative.rng;
    log.push('#'+id+' '+info[1]+' (§'+info[2]+') · '+(output.n?'execute':output.reason));
    if(!output.n) {
      log.push(...local.filter(line=>line.includes('rolled')));
      continue;
    }
    if(context.guideCommand) {
      g.rng=conditionRng;
      log.push(...local.slice(0,conditionLog));
    } else {
      Object.assign(g,tentative);
      log.push(...local);
    }
    return {...output,id,command:info[1]};
  }
  return null;
}
function botPass(g,f,log,why,reserved=false) {
  log.push(why);
  record(g,f,'pass',log,{reserved});
  return NAME[f]+' · Pass';
}
function tryEvent(g,f,side,log,why,context={},capability=false) {
  log.push(why);
  const tentative=clone(g), local=[];
  const drawLimited=(game,faction,record)=>{
    record.push('Draw from the Moderates mini-deck for a free Limited Command.');
    return botDraw(game,faction,1,record);
  };
  const done=capability?autoEvent(tentative,f,g.current,side,local):botEvent(tentative,f,g.current,side,local,{drawLimited});
  g.rng=tentative.rng;
  log.push(...local);
  if(done===false) {
    log.push('§8.1.4–5 · Event cannot change the position as directed by the bot’s instructions.');
    return false;
  }
  if(done===null) {
    g.interrupt=manualEvent(g,f,side,context);
    return NAME[f]+' · Check Event '+eventName(g.current);
  }
  Object.assign(g,tentative);
  if(side&&eventSides(g.current).length>1) log.push('Event side · '+(side==='dark'?'Shaded':'Unshaded')+'.');
  if(g.interrupt) {
    if(g.interrupt.event==null) g.interrupt.event=g.current;
    g.interrupt.playedBy=f;
    return NAME[f]+' · Begin Event '+eventName(g.current);
  }
  record(g,f,'event',log);
  return NAME[f]+' · Event '+eventName(g.current);
}
function capabilityCount(g,f) {
  return g.held[f].length+Object.values(g.board).reduce((n,b)=>n+b.caps[f].length,0);
}
function takeCommand(g,f,log,{full,limited,guideCommand}) {
  const plan=botDraw(g,f,full?99:1,log,{allowLimited:limited,guideCommand});
  if(!plan) return null;
  const action=full&&(plan.special||plan.n>1||!limited)?'full':'limited';
  if(guideCommand) {
    const title=NAME[f]+' · #'+plan.id+' '+plan.command;
    g.interrupt={kind:'manual',scope:'bot-command',f,action,choices:[...(full?['full']:[]),...(limited?['limited']:[]),'pass'],title,aid:false,
      instruction:'Use the boxed bot card and faction aid for this Command. Keep any condition roll shown in the action record. Resolve ties and effects at the table, then record the resulting board and eligibility box. If the card has no legal Command, use the published redraw procedure before recording.'};
    return title+' · Open tabletop entry';
  }
  const news=action==='limited'&&f!=='m'&&g.news.some(n=>n.owner===f);
  record(g,f,action,log,{news});
  if(news) g.interrupt={kind:'news',f,bot:true,title:NAME[f]+' · News follow-up'};
  return NAME[f]+' · '+plan.command+(plan.special?' + '+plan.special:'');
}
function botTurn(g,log,{resumeAfter=null,guideCommand=false}={}) {
  const f=actor(g), possible=options(g), card=g.current, next=g.upcoming;
  const mayEvent=possible.includes('event');
  const currentTag=eventTag(card,f);
  const taggedSide=card===19&&f==='m'?(g.tracks.rC+g.tracks.sC>=5?'light':'dark'):
    card===34&&f==='m'?'dark':card===45&&f==='s'?'light':currentTag?.side??null;
  const resume={reserved:1,capability:3,symbol:4,fallback:6}[resumeAfter]??0;
  let triedCurrent=Boolean(resume);
  const protectIssue=resume<1&&shouldBlockEvent(g,f,card);
  if(protectIssue) {
    log.push('Boxed Event instructions · Open with a Limited Command to protect the Resolved Issue and close the Event box.');
    const result=takeCommand(g,f,log,{full:false,limited:true,guideCommand});
    if(result) return result;
    log.push('No Moderates card can close the Event box. Keep the Resolved Issue in place.');
  }
  if(!protectIssue&&mayEvent&&resume<1&&g.reserved?.f===f&&g.reserved.card===card) {
    const cap=preferredCapability(g,f,card);
    const result=tryEvent(g,f,cap??taggedSide,log,'§8.1.4(1) · NP to Play marker on this Event.',
      {reason:'Reserved on the previous Event',source:'reserved',guideCommand},Boolean(cap));
    if(result) return result;
    triedCurrent=true;
  }
  if(resume<2&&(!g.reserved||g.reserved.card!==next)&&EVENTS[next]?.pass.includes(f)) {
    if(passForEvent(g,f,next)) return botPass(g,f,log,'§8.1.4(2) · The upcoming Pass symbol and its boxed instructions apply.',true);
    log.push('Skip the upcoming Pass symbol. The boxed Event condition is unmet.');
  }
  if(resume<3&&f!=='m') {
    const here=mayEvent&&!triedCurrent?preferredCapability(g,f,card):null;
    const soon=(!g.reserved||g.reserved.card!==next)&&!g.actions.some(x=>x.action==='pass')?preferredCapability(g,f,next):null;
    if(here||soon) {
      const train=f==='s'&&[15,17].includes(here?card:next);
      const threshold=2*capabilityCount(g,f)+(f==='r'?2:0);
      if(train||roll(g,log,'Capability check, must exceed '+threshold)>threshold) {
        if(here) {
          const result=tryEvent(g,f,here,log,'§8.1.4(3) · Take the current Capability.',{reason:'Capability priority',source:'capability',guideCommand},true);
          if(result) return result;
          triedCurrent=true;
        } else return botPass(g,f,log,'§8.1.4(3) · Pass for the upcoming '+(train?'Senate Train':'Capability')+'.',true);
      }
    }
  }
  if(!protectIssue&&mayEvent&&resume<4&&!triedCurrent&&(currentTag||card===45&&f==='s')) {
    const result=tryEvent(g,f,taggedSide,log,'§8.1.4(4) · Check the boxed priority for the current Event.',{reason:'Matching Event symbol',source:'symbol',guideCommand});
    if(result) return result;
    triedCurrent=true;
  }
  const full=left(g)===1&&possible.includes('full');
  const limited=possible.includes('limited');
  if(!protectIssue&&(full||limited)) {
    const result=takeCommand(g,f,log,{full,limited,guideCommand});
    if(result) return result;
  }
  if(!protectIssue&&resume<6&&!triedCurrent&&mayEvent&&!limited&&!full) {
    const result=tryEvent(g,f,taggedSide,log,'§8.1.4(6) · Event is the remaining non-Pass box.',{fallback:true,reason:'Only Event or Pass remains',source:'fallback',guideCommand});
    if(result) return result;
  }
  return botPass(g,f,log,'§8.1.4(7) · No executable action under the current priorities and available boxes.');
}
function botNews(g,log) {
  const {f}=g.interrupt;
  const token=pick(g,g.news.filter(n=>n.owner===f));
  if(token) {
    g.news=g.news.filter(n=>n.id!==token.id);
    log.push('Spend News #'+token.id+' from '+spaceName(token.space)+' and draw from a fresh mini-deck.');
  }
  const plan=botDraw(g,f,1,log);
  g.interrupt=null;
  finishTurn(g,log);
  return NAME[f]+' · News'+(plan?' → '+plan.command:'');
}

return {executeBotCard,botDraw,botTurn,botNews};
},

  setFields(g.tracks,edit.tracks,TRACKS);
  if(edit.issues!==undefined) {
    g.issues=clone(edit.issues);

  }
  if(edit.news!==undefined) g.news=clone(edit.news);
  if(edit.sabotage!==undefined) g.sabotage=clone(edit.sabotage);
  if(edit.held!==undefined) g.held=clone(edit.held);
  for(const f of ['r','s']) if(!g.humans.includes(f)) g.tracks[f]=0;

"engine.js": function(require) {
const { NAME, eventName}=require("data.js");
const {boardDiff, clone, human, validateGame}=require("model.js");
const {actor, advanceCard, endGermany, enterCard, finishTurn, options, record, revealUpcoming, startCards}=require("sequence.js");
const {botNews, botTurn}=require("bots.js");
const {finishEventChoice, hennala}=require("bot-events.js");
const {autoEvent, eventSides, manualEvent}=require("events.js");
const {applyHumanCommand, legalCommands}=require("human.js");
const {applyEdits}=require("editor.js");
const {germanAction, propaganda, resolveAgitate, resolveCapability, resolvePolitics, resolvePrisoners, resolveRevolt, revolt}=require("rounds.js");

const requireStage=(g,stage)=>{
  if(g.stage!==stage||g.interrupt) throw Error('Finish the current procedure first.');
};
function resolveManual(g,log,intent) {
  const p=g.interrupt;
  if(intent.skip&&p.scope!=='event') throw Error('Record the tabletop result, even if no pieces changed.');
  if(p.scope==='event'&&intent.skip) {
    g.interrupt=null;
    if(human(g,p.f)) return 'Return to '+NAME[p.f]+' choices';
    return botTurn(g,log,{resumeAfter:p.source??(p.fallback?'fallback':'symbol'),guideCommand:p.guideCommand});
  }
  const side=intent.side??p.side;
  if(p.scope==='event'&&!eventSides(p.card).includes(side)) throw Error('Choose the side of the Event that was used.');
  applyEdits(g,intent.edit);
  g.interrupt=null;
  if(p.scope==='event') {
    log.push('Tabletop · '+eventName(p.card)+' ('+(side==='dark'?'shaded':'unshaded')+').');
    if(intent.note) log.push(String(intent.note).slice(0,380));
    record(g,p.f,'event',log);
  } else if(p.scope==='command') {
    finishFactionCommand(g,p.f,p.action,log,false);
    log.push('Tabletop · '+p.title+'.');
  } else if(p.scope==='bot-command') {
    const action=intent.recordAction??p.action;
    if(!p.choices.includes(action)) throw Error('Choose an available eligibility box.');
    finishFactionCommand(g,p.f,action,log,true);
    log.push('Tabletop · '+p.title+' resolved.');
  } else if(p.scope==='news') finishTurn(g,log);
  else if(p.scope==='german') {
    g.tracks.coordinate=false;
    endGermany(g);
  } else if(p.scope==='revolt') g.revoltStep='caps';
  else throw Error('Unknown guided procedure.');
  return p.title+' · Recorded';
}
function finishFactionCommand(g,f,action,log,forceNews=false) {
  const tokens=g.news.filter(n=>n.owner===f);
  const bonus=action==='limited'&&f!=='m'&&tokens.length>0;
  record(g,f,action,log,{news:bonus});
  if(bonus) g.interrupt={kind:'news',f,bot:forceNews,title:NAME[f]+' · News follow-up'};
}
function pending(g,log,intent) {
  const p=g.interrupt;
  if(intent.type!=='resolve') throw Error('Resume the pending decision before taking another action.');
  if(p.kind==='manual') return resolveManual(g,log,intent);
  if(p.kind==='news') {
    if(p.bot) return botNews(g,log);
    g.interrupt=null;
    if(intent.use) {
      const news=g.news.find(n=>n.id===Number(intent.token)&&n.owner===p.f);
      if(!news) throw Error('Choose a News marker this faction holds.');
      g.news=g.news.filter(n=>n.id!==news.id);
      if(intent.manual) {
        g.interrupt={kind:'manual',scope:'news',f:p.f,title:p.title,instruction:'Resolve one additional non-free Limited Command. Enter any Resources and board changes. Keep the first Limited Command box.'};
        return p.title+' · Spend News #'+news.id;
      }
      applyHumanCommand(g,p.f,log,intent,{limited:true});
    }
    finishTurn(g,log);
    return p.title+(intent.use?' · Extra Limited Command':' · Keep News');
  }
  if(p.kind==='event-choice') finishEventChoice(g,log,intent);
  else if(p.kind==='politics') resolvePolitics(g,log,intent);
  else if(p.kind==='agitate') resolveAgitate(g,log,intent);
  else if(p.kind==='prisoners') {
    resolvePrisoners(g,log,intent);
    if(p.event===28) hennala(g,log,p.f==='r'?'s':'end');
  }
  else if(p.kind==='revolt') resolveRevolt(g,log,intent);
  else if(p.kind==='capabilities') resolveCapability(g,log,intent);
  else throw Error('Unknown pending choice.');
  if(p.event) {
    if(g.interrupt) {
      g.interrupt.event=p.event;
      g.interrupt.playedBy=p.playedBy;
    } else record(g,p.playedBy,'event',log);
  }
  return p.title;
}
function humanTurn(g,log,intent) {
  const f=actor(g), {action}=intent;
  if(!human(g,f)||!options(g).includes(action)) throw Error('Choose an available action for the current human faction.');
  if(action==='pass') {
    record(g,f,'pass',log);
    log.push(NAME[f]+' stays eligible for the next card and gains one Resource, up to 30.');
    return NAME[f]+' · Pass';
  }
  if(action==='event') {
    if(!eventSides(g.current).includes(intent.side)) throw Error('Choose the unshaded or shaded Event.');
    const result=autoEvent(g,f,g.current,intent.side,log,intent);
    if(result===null) {
      g.interrupt=manualEvent(g,f,intent.side,{reason:'Human Event'});
      return NAME[f]+' · Open Event '+eventName(g.current);
    }
    record(g,f,'event',log);
    return NAME[f]+' · Event '+eventName(g.current);
  }
  if(!legalCommands(g,f).includes(intent.command)) throw Error('Choose a Command for this faction and phase.');
  if(intent.manual) {
    g.interrupt={kind:'manual',scope:'command',f,action,title:NAME[f]+' · '+intent.command,
      instruction:'Resolve the chosen '+(action==='limited'?'Limited Command':'Command and any accompanying Special Activity')+' using the faction aid. Enter every changed space, marker and Resource. The app records the selected eligibility box when you apply the result.'};
    return g.interrupt.title+' · Open tabletop entry';
  }
  applyHumanCommand(g,f,log,intent,{limited:action==='limited'});
  finishFactionCommand(g,f,action,log);
  return NAME[f]+' · '+intent.command+(intent.special?.name?' + '+intent.special.name:'');
}
function preview(current,intent) {
  if(!intent||typeof intent.type!=='string') throw Error('Choose an action.');
  const g=clone(current), log=[];
  let title;
  if(intent.type==='correct') {
    applyEdits(g,intent.edit);
    title='Board correction';
    log.push('Record the physical position. Eligibility and the random stream are preserved.');
  } else if(g.interrupt) title=pending(g,log,intent);
  else if(intent.type==='start') {
    requireStage(g,'setup');
    startCards(g,log,intent);
    title='Confirm opening setup';
  } else if(intent.type==='reveal') {
    requireStage(g,'reveal');
    revealUpcoming(g,log,intent.card);
    title='Reveal upcoming card';
  } else if(intent.type==='enter') {
    requireStage(g,'enter');
    enterCard(g,log);
    title='Start '+eventName(g.current);
  } else if(intent.type==='advance') {
    requireStage(g,'advance');
    advanceCard(g,log);
    title='Advance card and eligibility';
  } else if(intent.type==='german') {
    requireStage(g,'german');
    title=germanAction(g,log);
  } else if(intent.type==='revolt') {
    requireStage(g,'revolt');
    title=revolt(g,log);
  } else if(intent.type==='propaganda') {
    requireStage(g,'propaganda');
    title=propaganda(g,log,intent);
  } else if(intent.type==='bot') {
    requireStage(g,'turn');
    if(!actor(g)||human(g,actor(g))) throw Error('It is not a bot turn.');
    title=botTurn(g,log,{guideCommand:Boolean(intent.guideCommand)});
  } else if(intent.type==='human') {
    requireStage(g,'turn');
    title=humanTurn(g,log,intent);
  } else throw Error('That procedure is unavailable.');
  validateGame(g);
  return {after:g,title,log,diff:boardDiff(current,g)};
}

return {preview};
},
"event-redeploy.js": function(require) {
const {SPACE_IDS, TOWNS, pop, spaceName}=require("data.js");
const {cells, cleanSpace, control, forces, newsAt}=require("model.js");
const {chooseSpaceRanked}=require("random.js");

const neededForControl=b=>forces(b,'r')+forces(b,'m')+1;
const capGap=(count,n)=>count>=3?Math.abs(2-n):0;
function* allocations(donor,targets,needed,room,index=0,left=donor.count,stock=donor.caps,moves=[]) {
  if(index===targets.length) {
    if(moves.length&&(left||!stock)) {
      yield {moves,gap:capGap(left,stock)-capGap(donor.count,donor.caps)};
    }
    return;
  }
  for(let amount=0;amount<=Math.min(needed[index],left-donor.keep);amount++) {
    const maxCaps=amount?Math.min(room[index],stock):0;
    for(let caps=0;caps<=maxCaps;caps++) {
      const next=amount?[...moves,{index,from:donor.id,to:targets[index],amount,caps}]:moves;
      yield* allocations(donor,targets,needed,room,index+1,left-amount,stock-caps,next);
    }
  }
}
function makePlan(g,ids,targets,counts,need,keep) {
  const donors=ids.map(id=>({id,count:counts[id],caps:g.board[id].caps.s.length,keep:keep[id]}));
  const targetCaps=targets.map(id=>g.board[id].caps.s.length);
  const initialRoom=targetCaps.map(caps=>Math.max(0,2-caps));
  const spare=[...donors.map(donor=>donor.count-donor.keep),0];
  for(let i=spare.length-2;i>=0;i--) spare[i]+=spare[i+1];
  const memo=new Map();
  // The roll limits all transfers to six Cells. Reuse subproblems with the same remaining demand.
  function solve(start,needed,room) {
    const total=needed.reduce((sum,n)=>sum+n,0);
    if(total===0) {
      const gap=targets.reduce((sum,id,i)=>sum+capGap(need[id],targetCaps[i]+initialRoom[i]-room[i])-capGap(counts[id],targetCaps[i]),0);
      return {gap,choices:[]};
    }
    if(total>spare[start]) return {gap:Infinity,choices:[]};
    const key=[start,...needed,...room].join(',');
    if(memo.has(key)) return memo.get(key);
    let best=Infinity, choices=[];
    for(let i=start;i<donors.length&&total<=spare[i];i++) {
      for(const {moves,gap} of allocations(donors[i],targets,needed,room)) {
        const nextNeeded=[...needed], nextRoom=[...room];
        for(const move of moves) {
          nextNeeded[move.index]-=move.amount;
          nextRoom[move.index]-=move.caps;
        }
        const tail=solve(i+1,nextNeeded,nextRoom), totalGap=gap+tail.gap;
        if(totalGap===Infinity||totalGap>best) continue;
        if(totalGap<best) choices=[];
        best=totalGap;
        choices.push({moves,tail});
      }
    }
    const result={gap:best,choices};
    memo.set(key,result);
    return result;
  }
  return solve(0,targets.map(id=>need[id]-counts[id]),initialRoom);
}
function plans(g,limit) {
  const counts=Object.fromEntries(SPACE_IDS.map(id=>[id,cells(g.board[id],'s')]));
  const need=Object.fromEntries(SPACE_IDS.map(id=>[id,neededForControl(g.board[id])]));
  const gains=TOWNS.filter(id=>counts[id]>0&&counts[id]<need[id]);
  const keep=Object.fromEntries(SPACE_IDS.map(id=>{
    const b=g.board[id];
    const townMinimum=TOWNS.includes(id)&&control(b)==='s'?need[id]:0;
    return [id,Math.max(townMinimum,b.sPrep,Math.min(counts[id],newsAt(g,id,'s').length))];
  }));
  const possible=[];
  for(let mask=1;mask<(1<<gains.length);mask++) {
    const targets=gains.filter((_,i)=>mask&(1<<i));
    const moved=targets.reduce((n,id)=>n+need[id]-counts[id],0);
    if(moved>limit) continue;
    const donors=SPACE_IDS.filter(id=>!targets.includes(id)&&counts[id]>keep[id]);
    if(donors.reduce((n,id)=>n+counts[id]-keep[id],0)<moved) continue;
    const allocation=makePlan(g,donors,targets,counts,need,keep);
    if(allocation.gap===Infinity) continue;
    const population=targets.reduce((n,id)=>n+pop(id),0);
    const support=targets.reduce((n,id)=>n+g.board[id].support,0);
    possible.push({allocation,targets,ranks:[-population,support,moved,allocation.gap]});
  }
  return possible;
}

function canRedeploy(g) {
  return plans(g,3).length>0;
}
function redeploy(g,limit,log) {
  const plan=chooseSpaceRanked(g,plans(g,limit),p=>p.ranks,log,
    '#42 · Maximize additional Senate Town Population, then least Support',
    p=>p.targets.map(spaceName).join(' and '),p=>p.targets[0]);
  if(!plan) return false;
  for(let group=plan.allocation;group.choices.length;) {
    const choice=chooseSpaceRanked(g,group.choices,()=>[],log,
      '#42 · Preserve controlled Towns and balance Capabilities',c=>spaceName(c.moves[0].from),c=>c.moves[0].from);
    for(const {from,to,amount,caps} of choice.moves) {
      const source=g.board[from], dest=g.board[to], inactive=Math.min(amount,source.sI);
      if(caps) dest.caps.s.push(...source.caps.s.splice(-caps));
      source.sI-=inactive;
      source.sA-=amount-inactive;
      dest.sI+=inactive;
      dest.sA+=amount-inactive;
      cleanSpace(g,from);
      log.push('Redeploy '+amount+' Senate Cell'+(amount===1?'':'s')+(caps?' and '+caps+' Capabilities':'')+' · '+spaceName(from)+' → '+spaceName(to)+'.');
    }
    group=choice.tail;
  }
  return true;
}

return {canRedeploy,redeploy};
},

"sequence.js": function(require) {
const {EVENTS, NAME, eventName}=require("data.js");
const {adjustResource, pools, score}=require("model.js");
const {roll}=require("random.js");

const TURN_LABEL = {pass:'Pass',limited:'Limited Command',full:'Command (may add Special Activity)',event:'Event'};
const actor = g=>g.eligible.find(f=>!g.actions.some(a=>a.f===f))??null;
const left = g=>g.eligible.filter(f=>!g.actions.some(a=>a.f===f)).length;
const opening = g=>g.actions.find(x=>x.action!=='pass')?.action;
function options(g) {
  if(!actor(g)) return [];
  const initial=opening(g);
  const occupied=g.actions.filter(x=>x.action!=='pass').map(x=>x.action);
  const possible=initial==='limited'?['full','limited']:initial==='full'?['event','limited']:initial==='event'?['full','limited']:['limited','full','event'];
  return ['pass',...possible.filter(action=>action!=='event'||g.current!==24).filter(action=>
    action==='limited'&&initial==='limited'?occupied.filter(x=>x==='limited').length<2:!occupied.includes(action))];
}
function record(g,f,action,log,{reserved=false,news=false}={}) {
  if(f!==actor(g)||!options(g).includes(action)) throw Error('That action is unavailable on the Sequence of Play.');
  g.actions.push({f,action});
  if(action==='pass') {
    adjustResource(g,f,1);
    if(reserved) g.reserved={f,card:g.upcoming};
  }
  if(g.reserved?.f===f&&g.reserved.card===g.current) g.reserved=null;
  if(news) return;
  finishTurn(g,log);
}
function finishTurn(g,log) {
  if(g.phase===1&&score(g).cellTrack>=27&&g.upcoming!==24) {
    if(g.upcoming!==null) discard(g,g.upcoming);
    if(g.reserved?.card===g.upcoming) g.reserved=null;
    g.upcoming=24;
    log.push('§2.4 · 27 or more Reds and Senate Cells. Red Revolt! replaces the upcoming card.');
  }
  if(!actor(g)) g.stage=g.german==='after'?'german':'advance';
}
function discard(g,id) { if(!g.seen.includes(id)) g.seen.push(id); }
function reorder(g) {
  const row=opening(g);
  const byLetter = x=>x.action==='limited'?(row==='full'||(row==='limited'&&x===g.actions.find(a=>a.action==='limited'))?3:2):x.action==='event'?(row==='event'?3:2):0;
  const passes=g.actions.filter(x=>x.action==='pass').map(x=>x.f);
  const rest=g.actions.filter(x=>!['pass','full'].includes(x.action)).sort((a,b)=>byLetter(a)-byLetter(b)).map(x=>x.f);
  g.eligible=[...passes,...(g.ineligible?[g.ineligible]:[]),...rest];
  g.ineligible=g.actions.find(x=>x.action==='full')?.f??null;
  g.actions=[];
  g.german=null;
}
function validPhysical(g,id) {
  if(!EVENTS[id]||id===24||g.seen.includes(id)||id===g.current||id===g.upcoming) throw Error('Select a different Event card that has not been used.');
  return id;
}
function reveal(g,id) {
  if(g.mode==='digital') return g.deck.shift()??null;
  return validPhysical(g,id);
}
function showUpcoming(g,log) {
  if(EVENTS[g.upcoming]?.prop) {
    [g.current,g.upcoming]=[g.upcoming,g.current];
    g.round++;
    g.roundStep='victory';
    g.stage='propaganda';
    log.push('§2.3 · Set the Propaganda card in front of the displaced Event. Keep eligibility unchanged.');
  } else {
    g.stage='enter';
  }
}
function startCards(g,log,intent) {
  if(g.mode==='digital') {
    g.current=reveal(g);
    g.upcoming=reveal(g);
  } else {
    g.current=validPhysical(g,Number(intent.current));
    g.upcoming=reveal(g,Number(intent.upcoming));
    if([g.current,g.upcoming].some(id=>EVENTS[id].prop||EVENTS[id].year!==1917)) throw Error('The first two cards must be 1917 Events.');
  }
  showUpcoming(g,log);
  g.cardNumber=1;
  log.push('Set '+eventName(g.current)+' in the current slot.');
  if(g.upcoming) log.push('Upcoming · '+eventName(g.upcoming)+'.');
}
function advanceCard(g,log) {
  reorder(g);
  if(g.current!==null) discard(g,g.current);
  if(g.reserved?.card===g.current) g.reserved=null;
  g.current=g.upcoming;
  g.upcoming=null;
  g.cardNumber++;
  g.stage='reveal';
  log.push('Move '+eventName(g.current)+' to the current slot.');
  log.push('Eligibility · '+g.eligible.map(f=>NAME[f]).join(' → ')+(g.ineligible?'; ineligible '+NAME[g.ineligible]:''));
  if(g.mode==='digital') revealUpcoming(g,log);
}
function revealUpcoming(g,log,card) {
  g.upcoming=reveal(g,Number(card));
  showUpcoming(g,log);
  if(g.upcoming) log.push('Upcoming · '+eventName(g.upcoming)+'.');
}
function enterCard(g,log) {
  if(g.current===24) {
    g.stage='revolt';
    return;
  }
  if(g.phase===2&&EVENTS[g.current]?.german&&(pools(g).g>0||Object.values(g.board).some(b=>b.g))) {
    g.german=roll(g,log,'German timing (§3.4)')<=3?'before':'after';
    log.push('Germany acts '+g.german+' the factions.');
  }
  g.stage=g.german==='before'?'german':'turn';
}
function endGermany(g) {
  if(g.german==='before') g.stage='turn';
  else g.stage='advance';
  g.german='done';
}
function endPropaganda(g,log) {
  if(g.current!==null) discard(g,g.current);
  if(g.round===2&&g.phase===1&&g.upcoming!==24) {
    if(g.upcoming!==null) discard(g,g.upcoming);
    if(g.reserved?.card===g.upcoming) g.reserved=null;
    g.upcoming=24;
    log.push('§6.5.2 · Replace the displaced Event with Red Revolt!.');
  }
  g.current=g.upcoming;
  g.upcoming=null;
  g.stage='reveal';
  if(g.mode==='digital') revealUpcoming(g,log);
}
function beginRevolt(g) {
  const index=g.eligible.indexOf('r');
  if(index<0) {
    g.ineligible=null;
    g.eligible.unshift('r');
  }
  g.actions=[{f:'r',action:'event'}];
}
function endRevolt(g) {
  g.phase=2;
  g.stage=actor(g)?'turn':'advance';
}

return {TURN_LABEL,actor,left,opening,options,record,finishTurn,reorder,startCards,advanceCard,revealUpcoming,enterCard,endGermany,endPropaganda,beginRevolt,endRevolt};
},
"storage.js": function(require) {
const {BORDERS, COMMANDS, FACTIONS, MARK, SPACE_IDS, SPECIALS, TYPES, VERSION}=require("data.js");

const SCHEMA=2;

  const previous=from.pop();
  to.push({label:previous.label,game:entry.game,draft:entry.draft,last:entry.last});
  entry.game=previous.game;

  if(old>=0) entry.checkpoints[old]=item;

function encodeCampaign(entry) {

  if(exceedsSaveLimit(raw)) throw Error('This campaign exceeds the '+MAX_SAVE_BYTES/1_000_000+' MB import limit.');

function encodeBackupParts(collection) {
  // Measure each campaign once, then assemble complete schema-2 files.
  const entries=collection.campaigns.map(campaign=>{
    const raw=JSON.stringify(campaign);
    return {id:campaign.id,raw,bytes:utf8Bytes(raw)};
  });
  const header=active=>{
    const {savedAt,exportedAt}=collection;
    return encode({active,savedAt,exportedAt,campaigns:[]}).slice(0,-2);
  };
  // Reserve enough room for any valid active ID, including the first ID of a new part.
  const longestId=entries.reduce((longest,item)=>item.id.length>(longest?.length??0)?item.id:longest,null);
  const overhead=utf8Bytes(header(longestId))+2;
  const parts=[];
  let batch=[], bytes=overhead;
  const finishPart=()=>{
    const active=batch.some(item=>item.id===collection.active)?collection.active:batch[0].id;
    const raw=header(active)+batch.map(item=>item.raw).join(',')+']}';
    parts.push({raw,bytes:utf8Bytes(raw),campaigns:batch.length});
    batch=[];
    bytes=overhead;
  };
  for(const item of entries) {
    if(item.bytes+overhead>MAX_SAVE_BYTES) throw Error('A campaign exceeds the '+MAX_SAVE_BYTES/1_000_000+' MB import limit. Export other campaigns individually.');
    if(batch.length&&bytes+1+item.bytes>BACKUP_PART_BYTES) finishPart();

function decode(raw,{onDraftRecovery}={}) {

  const saved=JSON.parse(raw,(key,value)=>{
    if(['__proto__','prototype','constructor'].includes(key)) throw Error('Invalid save field.');
    return value;
  });
  if(!saved||saved.type!==TYPE||![1,SCHEMA].includes(saved.schema)) throw Error('This is not a supported All Bridges Burning save.');
  const collection=saved.schema===1?migrate(saved):{active:saved.active,campaigns:saved.campaigns};
  if(!Array.isArray(collection.campaigns)||collection.campaigns.length>MAX_CAMPAIGNS) throw Error('Invalid campaign list.');
  for(const key of ['savedAt','exportedAt']) if(timestamp(saved[key])) collection[key]=saved[key];
  const restore=(draft,game)=>{
    const recovered=recoverDraft(draft,game);
    if(recovered!==draft) onDraftRecovery?.();
    return recovered;
  };
  const ids=new Set();
  for(const c of collection.campaigns) {
    if(typeof c?.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(c.id)||ids.has(c.id)||typeof c.name!=='string'||c.name.length<1||c.name.length>100) throw Error('Invalid campaign identity.');

    for(const field of ['undo','redo','checkpoints']) {
      if(!Array.isArray(c[field])||c[field].length>HISTORY_LIMIT) throw Error('Invalid campaign '+field+'.');
      for(const entry of c[field]) {
        if(typeof entry?.label!=='string'||entry.label.length>220) throw Error('Invalid saved history entry.');

function validateEdit(edit) {
  if(!isPlainObject(edit)) throw Error('Invalid board edits.');
  if(edit.focus!==undefined&&edit.focus!==null&&!isSpaceOrEmpty(edit.focus)) throw Error('Invalid edited space focus.');
  if(edit.spaces!==undefined) {
    if(!isPlainObject(edit.spaces)) throw Error('Invalid edited spaces.');
    for(const [spaceId,sp] of Object.entries(edit.spaces)) {
      if(!SPACE_IDS.includes(spaceId)||!isPlainObject(sp)) throw Error('Invalid edited space entry.');
      for(const key of MARK) if(!isOptInt(sp[key],0,key.endsWith('Prep')?1:key.endsWith('Terror')?2:20)) throw Error('Invalid edited piece count.');
      if(sp.support!==undefined&&!isInt(sp.support,-2,2)) throw Error('Invalid edited Support or Opposition.');
      if(sp.person!==undefined&&typeof sp.person!=='boolean') throw Error('Invalid edited Personality flag.');
      if(sp.caps!==undefined) {
        if(!isPlainObject(sp.caps)) throw Error('Invalid edited space Capabilities.');
        for(const f of ['r','s']) if(sp.caps[f]!==undefined&&(!Array.isArray(sp.caps[f])||sp.caps[f].length>8||sp.caps[f].some(cap=>!TYPES.includes(cap)))) throw Error('Invalid edited Capability list.');
      }
    }
  }
  if(edit.tracks!==undefined) {
    if(!isPlainObject(edit.tracks)) throw Error('Invalid edited tracks.');
    for(const [key,val] of Object.entries(edit.tracks)) {
      if(!EDIT_TRACKS.includes(key)) throw Error('Invalid edited track key.');
      if(key==='coordinate'?typeof val!=='boolean':!isOptInt(val,0,30)) throw Error('Invalid edited track value.');
    }
  }
  if(edit.news!==undefined&&(!Array.isArray(edit.news)||edit.news.length>2||edit.news.some(n=>!isPlainObject(n)||![1,2].includes(n.id)||!SPACE_IDS.includes(n.space)||n.owner!==null&&n.owner!==''&&!FACTIONS.includes(n.owner)))) throw Error('Invalid edited News.');
  if(edit.sabotage!==undefined&&(!Array.isArray(edit.sabotage)||edit.sabotage.length>BORDERS.length||edit.sabotage.some(b=>!BORDERS.includes(b)))) throw Error('Invalid edited Sabotage.');
  if(edit.issues!==undefined&&(!Array.isArray(edit.issues)||edit.issues.length!==3||edit.issues.some(x=>![null,'','r','s'].includes(x)))) throw Error('Invalid edited Issues.');
  if(edit.held!==undefined) {
    if(!isPlainObject(edit.held)) throw Error('Invalid edited Capabilities box.');
    for(const f of ['r','s']) if(edit.held[f]!==undefined&&(!Array.isArray(edit.held[f])||edit.held[f].length>8||edit.held[f].some(cap=>!TYPES.includes(cap)))) throw Error('Invalid edited held Capabilities.');
  }
}
function validateRow(row) {
  if(!isPlainObject(row)) throw Error('Invalid command row.');
  if(row.id!==undefined&&row.id!=='political'&&!isSpaceOrEmpty(row.id)) throw Error('Invalid command row space.');
  if(!isSpaceOrEmpty(row.from)||!isSpaceOrEmpty(row.to)) throw Error('Invalid command row movement space.');
  if(row.retreat!==undefined&&row.retreat!==null&&!isSpaceOrEmpty(row.retreat)) throw Error('Invalid command row retreat space.');
  if(row.option!==undefined&&typeof row.option!=='string') throw Error('Invalid command row option.');
  if(row.side!==undefined&&!['r','s','m'].includes(row.side)) throw Error('Invalid command row faction.');
  if(row.direction!==undefined&&!['active','inactive','support','opposition'].includes(row.direction)) throw Error('Invalid command row direction.');
  if(row.targets!==undefined&&typeof row.targets!=='string') throw Error('Invalid Terror target selection.');
  if(row.defenders!==undefined&&!['s','g','both'].includes(row.defenders)) throw Error('Invalid Attack defender selection.');
  if(row.casualty!==undefined&&!['active','inactive'].includes(row.casualty)) throw Error('Invalid Attack casualty order.');
  if(row.attrition!==undefined&&!['active','inactive'].includes(row.attrition)) throw Error('Invalid Attack attrition order.');
  if(row.capture!==undefined&&!isSpaceOrEmpty(row.capture)) throw Error('Invalid Message capture space.');
  for(const key of ['offset','count','russian','boost','token','localCount','localRussian','activateCount']) if(!isOptInt(row[key],0,30)) throw Error('Invalid command row count.');
  for(const key of ['shift','activeFirst','person','localActiveFirst']) if(row[key]!==undefined&&typeof row[key]!=='boolean') throw Error('Invalid command row flag.');
  if(row.caps!==undefined&&(!Array.isArray(row.caps)||row.caps.length>8||row.caps.some(cap=>!TYPES.includes(cap)))) throw Error('Invalid command row Capabilities.');
  if(row.sites!==undefined&&(!Array.isArray(row.sites)||row.sites.length>SPACE_IDS.length||row.sites.some(id=>!SPACE_IDS.includes(id)))) throw Error('Invalid Activism spaces.');

function validateSpecial(special) {

  if(special.name!==undefined&&special.name!==''&&!allSpecials.has(special.name)) throw Error('Invalid Special Activity name.');
  if(!isOptInt(special.timing,0,SPACE_IDS.length+1)||!isOptInt(special.boost,0,30)||!isOptInt(special.token,0,2)) throw Error('Invalid Special Activity number.');
  if(special.option!==undefined&&typeof special.option!=='string') throw Error('Invalid Special Activity option.');
  if(!isSpaceOrEmpty(special.id)) throw Error('Invalid Special Activity space.');
  if(special.border!==undefined&&special.border!==''&&!BORDERS.includes(special.border)) throw Error('Invalid Special Activity border.');
  if(special.side!==undefined&&!['r','s'].includes(special.side)) throw Error('Invalid Special Activity side.');
  if(special.sites!==undefined&&(!Array.isArray(special.sites)||special.sites.length>SPACE_IDS.length||special.sites.some(id=>!SPACE_IDS.includes(id)))) throw Error('Invalid Special Activity spaces.');
  if(special.amounts!==undefined) {
    if(!isPlainObject(special.amounts)) throw Error('Invalid Publish amounts.');
    for(const [site,val] of Object.entries(special.amounts)) if(!SPACE_IDS.includes(site)||!isOptInt(val,0,10)) throw Error('Invalid Publish amount entry.');
  }
}
function validateIntent(intent,game=null) {

  if(!allowedTypes.includes(intent.type)) throw Error('Invalid draft action type.');
  if(game) {
    const expected=game.interrupt?'resolve':game.stage==='setup'?'start':game.stage==='turn'?(human(game,actor(game))?'human':'bot'):game.stage;
    if(intent.type!==expected) throw Error('Draft action does not match the current stage.');

  if(intent.command!==undefined&&!allCommands.has(intent.command)) throw Error('Invalid draft command.');
  for(const key of ['manual','guideCommand','skip','use','reduce','disc']) if(intent[key]!==undefined&&typeof intent[key]!=='boolean') throw Error('Invalid draft boolean flag.');
  if(intent.side!==undefined&&!['light','dark','r','s'].includes(intent.side)) throw Error('Invalid draft side.');
  if(intent.recordAction!==undefined&&!['pass','limited','full','event'].includes(intent.recordAction)) throw Error('Invalid draft eligibility choice.');
  if(intent.choice!==undefined&&!['skip','remove','rally'].includes(intent.choice)) throw Error('Invalid draft revolt choice.');
  if(intent.power!==undefined&&!['r','s'].includes(intent.power)) throw Error('Invalid draft power choice.');
  if(intent.direction!==undefined&&!['lower','raise','support','opposition'].includes(intent.direction)) throw Error('Invalid draft direction.');
  if(intent.beneficiary!==undefined&&intent.beneficiary!==''&&!['r','s'].includes(intent.beneficiary)) throw Error('Invalid draft beneficiary.');
  if(intent.reward!==undefined&&!['resources','cube'].includes(intent.reward)) throw Error('Invalid draft reward.');
  if(intent.cube!==undefined&&!['r','s'].includes(intent.cube)) throw Error('Invalid draft cube.');
  if(!isSpaceOrEmpty(intent.space)||!isSpaceOrEmpty(intent.destination)) throw Error('Invalid draft space selection.');
  for(const key of ['current','upcoming','card','count','issue','token','amount']) if(!isOptInt(intent[key],0,60)) throw Error('Invalid draft number.');
  if(intent.note!==undefined&&(typeof intent.note!=='string'||intent.note.length>500)) throw Error('Invalid draft note.');
  if(intent.edit!==undefined) validateEdit(intent.edit);

    if(!Array.isArray(intent.rows)||intent.rows.length<1||intent.rows.length>maxRows) throw Error('Invalid draft command rows.');
    for(const row of intent.rows) validateRow(row);
  }

    if(!Array.isArray(intent.recycle)||intent.recycle.length>20) throw Error('Invalid draft recycle list.');
    for(const item of intent.recycle) {
      if(!isPlainObject(item)||!isSpaceOrEmpty(item.id)||typeof item.key!=='string'||!isOptInt(item.count,1,20)) throw Error('Invalid draft recycle entry.');
    }
  }
  if(intent.plans!==undefined) {
    if(!Array.isArray(intent.plans)||intent.plans.length>20) throw Error('Invalid draft Agitation plans.');
    for(const plan of intent.plans) {
      if(!isPlainObject(plan)||!isSpaceOrEmpty(plan.id)||!['shift','polarization','disc','cube'].includes(plan.kind)||!isOptInt(plan.steps,1,10)) throw Error('Invalid draft Agitation plan.');
      if(plan.direction!==undefined&&!['support','opposition'].includes(plan.direction)) throw Error('Invalid draft Agitation direction.');
      if(plan.side!==undefined&&!['r','s'].includes(plan.side)) throw Error('Invalid draft Agitation cube.');
    }

        } catch(error) {

    rawRecovery:()=>rejected??getStorage().getItem(REJECTED_KEY),

function estimateCommandSummary(g,f,intent,{limited=false}={}) {
  const cmd=intent.command, rows=Array.isArray(intent.rows)?intent.rows:[], spec=intent.special??{};
  let recycleInvalid=false;
  if(intent.recycle?.length) {
    const trial=clone(g);
    try { recycle(trial,f,intent.recycle); g=trial; }
    catch { recycleInvalid=true; }
  }
  const p=pools(g), activismSites=new Set();
  let cost=0, earned=0, discount=cmd==='Rally'&&f==='m'?Math.max(0,g.tracks.pol-5):0;
  for(const row of rows) {
    if(cmd==='Rally') {
      const c=1+((row.option??'cells')==='cells'?Math.max(0,Number(row.offset)||0):0);
      cost+=Math.max(0,c-discount);
      discount=Math.max(0,discount-c);
    } else if(cmd==='Politics') cost+=1+Math.floor(g.tracks.pol/2);
    else if(cmd==='Negotiate'||cmd==='Terror'||cmd==='Message') cost+=1;
    else if(cmd==='Activism') {
      if(row.option==='activate'||!activismSites.has(row.id)) cost++;
      if(row.option==='agitate'&&g.board[row.id]) cost+=redsAgitation(g,row).cost;
      if(row.option!=='activate') activismSites.add(row.id);
    } else if(cmd==='March') cost+=Math.ceil(Math.max(1,Number(row.count)||1)/3);
    else if(cmd==='Attack') cost+=(row.from===row.to?1:Math.ceil(Math.max(1,Number(row.count)||1)/3))+Math.max(0,Number(row.boost)||0);
  }
  if(!limited&&spec.name) {
    if(spec.name==='Foreign Relations'&&spec.option==='lower') cost+=Math.max(1,Number(spec.boost)||0);
    if(spec.name==='Political Event') earned+=(spec.sites??[]).length;
    if(spec.name==='Publish') {
      earned+=(spec.sites??[]).reduce((sum,id)=>sum+Number(town(id))+2*Math.max(0,Number(spec.amounts?.[id])||0),0);
    }
  }
  const legalSpaces=SPACE_IDS.filter(id=>{
    const b=g.board[id];
    if(cmd==='Rally') return p[f]>0||(f!=='s'&&p[f==='r'?'admin':'network']>0&&cells(b,f)>=2&&capacity(b)>0)||(f==='m'&&b.network&&b.mA>0);
    if(cmd==='Negotiate') return b.mI>0&&(b.rA>0||b.sA>0);
    if(cmd==='Terror') return terrorOptions(g,id,f).length>0;
    if(cmd==='Activism') return cells(b,f)>0||(f==='r'&&b.admin&&control(b)==='r');
    if(cmd==='March'||cmd==='Message') return cells(b,f)>0;
    if(cmd==='Attack') return cells(b,f)>0;

  const availPieces=[NAME[f]+' Cells: '+p[f]+(intent.recycle?.length&&!recycleInvalid?' after returns':'')];
  if(f==='r') availPieces.push('Admins: '+p.admin,'Russian Troops on map: '+SPACE_IDS.reduce((n,id)=>n+g.board[id].u,0),'Red Terror: '+p.rTerror);
  if(f==='s') availPieces.push('White Terror: '+p.sTerror,'Prepared: '+p.prep);
  if(f==='m') availPieces.push('Networks: '+p.network,'Personality: '+(personality(g)?spaceName(personality(g)):'Available'),'Cubes: Red '+p.rC+' / White '+p.sC);
  const maxSpaces=limited||cmd==='Politics'?1:cmd==='Rally'&&f!=='m'?Math.max(2,g.tracks.pol):SPACE_IDS.length+Number(cmd==='Activism');
  return {cost,earned,availableResources:g.tracks[f],legalSpaces,availPieces,maxSpaces,recycleInvalid};
}
function commandSummaryHtml(g,f,intent,limited) {
  const summary=estimateCommandSummary(g,f,intent,{limited});

    '<p class="quiet">'+escape(summary.availPieces.join(' · '))+'</p>'+
    (summary.recycleInvalid?'<p class="quiet">Check the pieces selected to return to Available.</p>':'')+
    (command==='Politics'?'':'<p class="quiet">'+(movement?'Origins with friendly Cells':'Candidate spaces')+' · '+escape(candidateText)+'</p>');

function rowHelperText(g,f,cmd,row) {

    }

    const movingCaps=row.caps??[];

    const attackCount=count+(moving?Number(row.localCount)||0:0);

    const {strength,breakdown}=battleStrengthDetails(g,{f,id:row.to,defenders,attackCount,russians,caps,boost:Number(row.boost)||0,bot:false});
    const rowCost=(row.from===row.to?1:Math.ceil(count/3))+(Number(row.boost)||0);

    return 'Origin '+spaceName(row.from)+': '+src[f+'A']+' active, '+src[f+'I']+' inactive'+(f==='r'?', '+src.u+' Russian':'')+

    }
    if(g.board[row.id]) {
      const b=g.board[row.id];
      if(row.option==='flip') return spaceName(row.id)+' · Max flips here: '+(b[f+'A']+Math.floor(b[f+'I']/2))+' · Enemy: '+b[(row.side??'s')+'A']+' active, '+b[(row.side??'s')+'I']+' inactive';
      if(row.option==='calm') return spaceName(row.id)+' · Active friendly Cells: '+b[f+'A'];
      if(row.option==='agitate') {
        return spaceName(row.id)+' · Admin: '+b.admin+' · Control: '+(NAME[control(b)]??'None')+' · Extra Agitate cost '+redsAgitation(g,row).cost;
      }
    }
  }
  if(cmd==='Message'&&g.board[row.from]) {
    const src=g.board[row.from], steps=(row.path??[]).filter(Boolean);
    const maxThreat=steps.reduce((m,id)=>Math.max(m,g.board[id]?Math.max(g.board[id].rA,g.board[id].sA):0),0);
    return 'Origin '+spaceName(row.from)+': '+src.mA+' active, '+src.mI+' underground'+(steps.length?' · Route max Capture threat: '+maxThreat:'');

  if(cmd==='Negotiate'&&g.board[row.id]) {
    const b=g.board[row.id];
    return spaceName(row.id)+' · Underground Moderates: '+b.mI+' · Active Reds: '+b.rA+' · Active Senate: '+b.sA;
  }
  if(cmd==='Terror'&&row.id&&row.id!=='political'&&g.board[row.id]) {
    const b=g.board[row.id];
    return spaceName(row.id)+' · Active friendly: '+b[f+'A']+' · Removal cap: '+(g.tracks.pol>=6?2:1)+' · Terror markers here: '+(b.rTerror+b.sTerror)+'/2';
  }
  return '';

function getPath(path) {
  const parts=path.split('.');
  if(parts[0]==='new') {
    parts.shift();
    return [draftNew,parts];
  }
  if(parts[0]==='rename') {
    parts.shift();
    return [renameState,parts];
  }
  return [entry()?.draft,parts];
}
const at=(obj,path)=>path.reduce((node,key)=>node?.[key],obj);
function assignPath(obj,parts,value) {
  const last=parts.at(-1);
  for(let i=0;i<parts.length-1;i++) {
    const key=parts[i], next=parts[i+1];
    if(obj[key]===undefined) obj[key]=/^\d+$/.test(next)?[]:{};
    obj=obj[key];
  }
  obj[last]=value;
}
function editBinding(path,value) {
  const parts=path.split('.');
  const isEdit=parts[0]==='edit'||parts[0]==='intent'&&parts[1]==='edit';
  if(!isEdit) return false;
  const offset=parts[0]==='edit'?1:2;
  const [obj]=getPath(path);
  const edit=at(obj,parts.slice(0,offset));
  const g=game(), tail=parts.slice(offset);
  if(tail[0]==='focus'&&value) editSpace(g,edit,value);
  if(tail[0]==='newsSlot') {
    edit.news??=clone(g.news);
    const id=Number(tail[1]);
    const token=edit.news.find(x=>x.id===id);
    if(tail[2]==='space') {
      if(!value) edit.news=edit.news.filter(x=>x.id!==id);
      else if(token) token.space=value;
      else edit.news.push({id,space:value,owner:null});
    } else if(token) token.owner=value||null;
    return true;
  }
  if(tail[0]==='issues') {
    edit.issues??=clone(g.issues);
    edit.issues[tail[1]]=value||null;
    return true;
  }
  if(tail[0]==='held'||tail[2]==='caps') {
    const [f,key]=tail.slice(-2), n=Number(value);
    const held=tail[0]==='held';
    const container=held?(edit.held??=clone(g.held)):(edit.spaces[tail[1]].caps??={});
    const previous=container[f]??g.board[tail[1]].caps[f];
    container[f]=previous.filter(cap=>cap!==key).concat(Array(Math.max(0,Math.min(20,Number.isInteger(n)?n:0))).fill(key));
    return true;
  }
  return false;
}

function binding(e) {
  const target=e.target;
  if(target.dataset?.checkItem) {
    const c=entry();
    if(!c) return;
    const set=new Set(c.draft.checkedItems??[]);
    if(target.checked) set.add(target.dataset.checkItem);
    else set.delete(target.dataset.checkItem);
    c.draft.checkedItems=[...set];
    changed();
    refresh();
    return;
  }
  const path=target.dataset.bind??target.dataset.list;
  if(!path) return;
  const [obj,parts]=getPath(path);
  if(!obj) return;
  const last=parts.at(-1);
  let value=target.type==='checkbox'?target.checked:target.type==='number'||Object.hasOwn(target.dataset,'number')?(target.value===''?'':Number(target.value)):target.value;
  if(target.dataset.list) {
    let old=at(obj,parts);
    if(path.endsWith('.sabotage')&&old===undefined) old=game().sabotage;
    const copy=new Set(old??[]);
    if(target.checked) copy.add(target.value);
    else copy.delete(target.value);
    value=[...copy];
  }
  if(path.includes('.capCounts.')) {
    const row=at(obj,parts.slice(0,-2));
    const n=Math.max(0,Math.min(8,Number.isInteger(value)?value:0));
    row.caps=(row.caps??[]).filter(cap=>cap!==last).concat(Array(n).fill(last));
  } else if(!editBinding(path,value)) assignPath(obj,parts,value);
  if(path==='intent.command') {
    obj.intent.rows=[makeRow(game(),value,game().interrupt?.f??actor(game()))];
    obj.intent.special={};
    resetSpecial(obj.intent);
  }
  if(path==='intent.special.name') resetSpecial(obj.intent);
  if(path==='intent.side') {
    delete obj.intent.destination;
    delete obj.intent.beneficiary;
    delete obj.intent.direction;
  }
  if(path.includes('.rows.')&&['id','from','to'].includes(last)) {
    const row=at(obj,parts.slice(0,-1));
    if(last==='id') {
      if(obj.intent.command==='Terror') row.targets='';
      if(obj.intent.command==='Rally') row.offset=0;
    }
    if(last==='from') {
      row.caps=[];
      row.to='';
      if(row.path) row.path=['','',''];
    }
    if(last==='from'||last==='to') {
      row.retreat='';
      row.localCount=0;
      row.localRussian=0;
      row.localActiveFirst=false;
    }
  }
  if(path.includes('.path.')) {
    const route=at(obj,parts.slice(0,-1));
    for(let i=Number(last)+1;i<route.length;i++) route[i]='';
  }
  if(!path.startsWith('new.')&&!path.startsWith('rename.')) changed();
  if(Object.hasOwn(target.dataset,'refresh')||path==='boardFilter'||path.endsWith('.special.sites')) {
    refresh();
  } else if(path.startsWith('intent.')) {
    updateFormGuidance();
  }
}
root.addEventListener('input',event=>{
  if(event.target.matches('input:not([type=checkbox]):not([type=file])')) binding(event);
});
root.addEventListener('change',event=>{
  if(event.target.id==='import-file') {
    const file=event.target.files?.[0];
    if(file) void importFile(file);
  } else if(!event.target.matches('input:not([type=checkbox])')) binding(event);
});
function applyPlan() {
  if(!activePreview||activePreview.campaign!==entry()?.id||activePreview.before!==game()) throw Error('The board changed. Preview the action again.');
  const {plan,screen:origin}=activePreview, c=entry(), old=c.game;
  const {after,title,log,diff}=plan;
  const cardChanged=old.current!==after.current&&old.stage!=='setup';
  after.changedSpaces=[...new Set([...(cardChanged?[]:old.changedSpaces??[]),...diff.spaces.map(x=>x.id)])];
  const beforeDraft=c.draft;
  commitCampaign(c,after,title,{title,log,diff});
  resetReceiptOpen=true;
  for(const key of ['boardFilter','boardScope','boardNear','boardFaction']) {
    if(beforeDraft[key]!==undefined) c.draft[key]=beforeDraft[key];
  }
  if(origin==='correct') {
    c.draft=clone(beforeDraft);
    delete c.draft.edit;
    delete c.draft.checkedItems;
    clearPreviewDraft(c.draft);
  }
  if(after.checkpoint&&old.stage==='propaganda'&&old.roundStep==='reset') checkpointCampaign(c,'After Propaganda '+old.round);
  activePreview=null;
  changed();
  void saveNow();
  message=origin==='correct'?'Board correction applied.':'';
  refresh(origin==='correct'?'board':'turn');
  document.getElementById('action-card')?.scrollIntoView({block:'nearest'});
}
function clearPreviewDraft(draft) {
  delete draft.previewMode;
  delete draft.previewVersion;
}
function setPreview(intent,origin) {
  const g=game();
  const plan=preview(g,intent);
  entry().draft.previewMode=origin;
  entry().draft.previewVersion=VERSION;
  activePreview={plan,screen:origin,campaign:entry().id,before:g};
  changed();
  void saveNow();
  focus('#preview-panel');
  refresh(origin);
  document.getElementById('preview-panel')?.scrollIntoView({block:'nearest'});
}
function recoverPreview(target=screen) {
  const c=entry();
  if(c) c.draft=recoverDraft(c.draft,c.game);
  const mode=c?.draft.previewMode;
  if(!mode||target!==mode&&target!=='resume') return target==='resume'?'turn':target;
  if(c.draft.previewVersion!==VERSION) {
    clearPreviewDraft(c.draft);
    message='The app was updated. Review a fresh preview before applying these saved choices.';
    changed();
    return mode;
  }
  try {
    const intent=mode==='correct'?{type:'correct',edit:c.draft.edit}:c.draft.intent;
    activePreview={plan:preview(c.game,intent),screen:mode,campaign:c.id,before:c.game};
    return mode;
  } catch {
    clearPreviewDraft(c.draft);
    c.draft=recoverDraft(c.draft,c.game);
    return target==='resume'?'turn':target;
  }
}
function download(raw,filename) {
  if(raw==null) throw Error('There is no saved copy to export.');
  const url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));
  const link=document.createElement('a');
  link.href=url;
  link.download=filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const safeName=value=>String(value).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,65)||'campaign';
function recordExport() {
  exportedAt=new Date().toISOString();
  if(status==='saved'&&changeSerial===writtenSerial) {
    changed({keepPreparedBackup:true});
    void saveNow();
  }
}
async function importFile(file) {
  try {
    if(file.size>MAX_SAVE_BYTES) throw Error('This save file is too large.');
    let recoveredDraft=false;
    const incoming=decode(await file.text(),{onDraftRecovery:()=>{recoveredDraft=true;}});
    if(!incoming.campaigns.length) throw Error('The file contains no campaigns.');
    collection=importCopies(collection,incoming);
    activePreview=null;
    message='Imported '+incoming.campaigns.length+' campaign '+(incoming.campaigns.length===1?'copy.':'copies.');
    if(recoveredDraft) message+=' Damaged form fields were cleared.';
    faulty='';
    showNew=false;
    changed();
    await saveNow();
    refresh('campaigns');
  } catch(error) {
    faulty='Import failed. '+error.message;
    refresh('campaigns');
  }
}
function doConfirm() {
  const choice=confirm;
  confirm=null;
  if(choice?.type==='delete') {
    const target=collection.campaigns.find(x=>x.id===choice.id);
    collection.campaigns=collection.campaigns.filter(c=>c.id!==choice.id);
    if(collection.active===choice.id) collection.active=collection.campaigns[0]?.id??null;
    message='Deleted '+target.name+'.';
    changed();
    void saveNow();
  }
  if(choice?.type==='reload') {
    const opened=store.open();
    collection=opened.collection;
    preparedBackup=null;
    exportedAt=collection.exportedAt;
    status=opened.status;
    backup=opened.backup;
    writtenSerial=changeSerial;
    remote=false;
    message=opened.recoveredDraft?recoveredMessage:'Loaded the saved workspace.';
  }
  if(choice?.type==='recover') {
    changed();
    void saveNow({recover:true});
  }
  refresh('campaigns');
}
root.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');
  if(!button) return;
  event.preventDefault();
  const {action,value}=button.dataset;
  const c=entry(), g=c?.game;
  faulty='';
  if(action!=='apply') message='';
  try {
    if(action==='screen') {
      activePreview=null;
      if(c&&changeSerial!==writtenSerial) void saveNow();
      refresh(value==='turn'&&!c?'campaigns':recoverPreview(value));
    } else if(action==='new') {
      showNew=true;
      refresh('campaigns');
      document.getElementById('new-campaign')?.scrollIntoView({block:'nearest'});
    } else if(action==='randomize') {
      draftNew.seed=randomSeed();
      refresh();
    } else if(action==='create') {
      const state=newGame({...draftNew,seed:draftNew.seed===''?randomSeed():Number(draftNew.seed)});
      const name=draftNew.name.trim()||'Full Campaign · '+state.humans.map(f=>NAME[f]).join(' + ');
      addCampaign(collection,newCampaign(name,state));
      draftNew={...draftNew,name:'',seed:randomSeed()};
      showNew=false;
      changed();
      void saveNow();
      refresh('turn');
    } else if(action==='open-campaign') {
      if(!collection.campaigns.some(x=>x.id===value)) throw Error('Campaign could not be opened.');
      activePreview=null;
      collection.active=value;
      changed();
      void saveNow();
      refresh(recoverPreview('resume'));
    } else if(action==='start-rename') {
      const target=collection.campaigns.find(x=>x.id===value);
      if(!target) throw Error('Campaign not found.');
      renameState={id:target.id,name:target.name};
      focus('[data-bind="rename.name"]');
      refresh('campaigns');
    } else if(action==='save-rename') {
      const target=collection.campaigns.find(x=>x.id===value);
      if(!target) throw Error('Campaign not found.');
      renameCampaign(target,renameState.name);
      renameState={id:null,name:''};
      message='Renamed campaign to '+target.name+'.';
      changed();
      void saveNow();
      refresh('campaigns');
    } else if(action==='cancel-rename') {
      renameState={id:null,name:''};
      refresh('campaigns');
    } else if(action==='duplicate-campaign') {
      const copy=duplicateCampaign(collection,value);
      activePreview=null;
      message='Duplicated campaign as '+copy.name+'.';
      changed();
      void saveNow();
      refresh('campaigns');
    } else if(action==='board-scope') {
      c.draft.boardScope=value;
      changed();
      refresh('board');
    } else if(action==='check-all-adjustments') {
      c.draft.checkedItems=checklistKeys(c.last);
      changed();
      refresh();
    } else if(action==='clear-adjustments') {
      c.draft.checkedItems=[];
      changed();
      refresh();
    } else if(action==='print-checklist') {
      const checklist=document.getElementById('tabletop-checklist');
      const sections=[checklist,...checklist.querySelectorAll('details[data-detail-key="receipt-tracks"]')];
      const wasOpen=sections.map(el=>el.open);
      sections.forEach(el=>{el.open=true;});
      try { window.print?.(); }
      finally { sections.forEach((el,index)=>{el.open=wasOpen[index];}); }
    } else if(action==='select-action') {
      const prior=c.draft.intent;
      c.draft.turnForms??={};
      c.draft.turnForms[prior.action]=prior;
      c.draft.intent=c.draft.turnForms[value]??{type:'human',action:value};
      changed();
      refresh();
    } else if(action==='preview') setPreview(c.draft.intent,'turn');
    else if(action==='preview-correction') setPreview({type:'correct',edit:c.draft.edit},'correct');
    else if(action==='dismiss-preview') {
      activePreview=null;
      clearPreviewDraft(c.draft);
      changed();
      void saveNow();
      refresh();
    } else if(action==='apply') applyPlan();
    else if(action==='undo'||action==='redo') {
      activePreview=null;
      const previous=g;
      const label=stepHistory(c,action);
      if(label) {
        message=(action==='undo'?'Undid ':'Redid ')+label+'. Check the tabletop position.';
        const diff=boardDiff(previous,c.game);
        c.last={title:(action==='undo'?'Undo':'Redo')+' · '+label,log:[],diff};
        delete c.draft.checkedItems;
        resetReceiptOpen=true;
        changed();
        void saveNow();
      }
      refresh('turn');
    } else if(action==='quick-correct') {
      const edit=ensure(c.draft,'edit',{});
      clearPreviewDraft(c.draft);
      if(value) {
        editSpace(g,edit,value);
        edit.focus=value;
      }
      activePreview=null;
      changed();
      refresh('correct');
    } else if(action==='clear-correction') {
      delete c.draft.edit;
      clearPreviewDraft(c.draft);
      changed();
      refresh();
    } else if(action==='focus-edit'||action==='reset-edit-space') {
      const [base,id]=value.split('|');
      const edit=at(c.draft,base.split('.'));
      if(action==='reset-edit-space') delete edit.spaces[id];
      editSpace(g,edit,id);
      edit.focus=id;
      changed();
      refresh();
    } else if(['add-row','remove-row','add-recycle','remove-recycle'].includes(action)) {
      const [base,index]=value.split('|'), intent=at(c.draft,base.split('.'));
      const atEnd=intent.special?.timing===intent.rows.length;
      if(action==='add-row'&&intent.rows.length<SPACE_IDS.length+Number(intent.command==='Activism')) {
        intent.rows.push(makeRow(g,intent.command,g.interrupt?.f??actor(g)));
      }
      if(action==='remove-row') intent.rows.splice(Number(index),1);
      if(action==='add-recycle') intent.recycle.push({id:'hel',key:(g.interrupt?.f??actor(g))+'I',count:1});
      if(action==='remove-recycle') intent.recycle.splice(Number(index),1);
      if(intent.special) intent.special.timing=atEnd?intent.rows.length:Math.min(intent.special.timing,intent.rows.length);
      changed();
      refresh();
    } else if(action==='add-agitation'||action==='remove-agitation') {
      if(action==='add-agitation') c.draft.intent.plans.push({id:'',kind:'shift',steps:1,side:'r'});
      else c.draft.intent.plans.splice(Number(value),1);
      changed();
      refresh();
    } else if(action==='export-one') {
      const item=collection.campaigns.find(x=>x.id===value);
      download(encodeCampaign(item),'abb-'+safeName(item.name)+'.json');
      recordExport();
      message='Campaign export prepared.';
      refresh();
    } else if(action==='export-all') {
      const parts=encodeBackupParts(collection);
      preparedBackup=null;
      if(parts.length===1) {
        download(parts[0].raw,'abb-campaigns.json');
        recordExport();
        message='Campaign collection export prepared.';
      } else {
        preparedBackup={parts,createdAt:new Date().toISOString()};
      }
      refresh();
    } else if(action==='export-part') {
      const {parts,createdAt}=preparedBackup;
      const stamp=createdAt.slice(0,19).replace(/:/g,'-');
      download(parts[Number(value)].raw,'abb-campaigns-'+stamp+'-part-'+(Number(value)+1)+'-of-'+parts.length+'.json');
      recordExport();
      message='Backup part '+(Number(value)+1)+' prepared.';
      refresh();
    } else if(action==='close-backup-downloads') {
      preparedBackup=null;
      refresh();
    } else if(action==='import') importInput.click();
    else if(action==='retry') void saveNow();
    else if(action==='download-recovery') download(store.rawRecovery(),'abb-unreadable-original.json');
    else if(action==='copy-backup') {
      const old=store.readBackup();
      if(!old) throw Error('No readable previous save is available.');
      const recovery=status==='recovery';
      collection=importCopies(collection,old);
      changed();
      void saveNow({recover:recovery});
      message='Imported the previous save as campaign copies.';
      refresh();
    } else if(action==='restore-checkpoint') {
      const cp=c.checkpoints[Number(value)];
      const after=clone(cp.game), title='Restore '+cp.label;
      commitCampaign(c,after,title,{title,log:[],diff:boardDiff(g,after)});
      c.draft=recoverDraft(clone(cp.draft),c.game);
      delete c.draft.checkedItems;
      resetReceiptOpen=true;
      changed();
      void saveNow();
      refresh('turn');
    } else if(action==='ask-delete') {
      confirm={type:'delete',id:value,text:'Delete '+collection.campaigns.find(x=>x.id===value).name+' from this browser?'};
      refresh();
    } else if(action==='ask-reload') {
      confirm={type:'reload',text:'Load the saved version and discard this tab’s unsaved changes?'};
      refresh();
    } else if(action==='replace-recovery') {
      confirm={type:'recover',text:'Archive the unreadable bytes and save the current workspace?'};
      refresh();
    } else if(action==='confirm') doConfirm();
    else if(action==='cancel-confirm') {
      confirm=null;
      refresh();
    }
  } catch(error) {
    faulty=error.message;
    focus('#error-note');
    refresh();
  }
});
window.addEventListener('storage',event=>{
  if(event.key!==STORAGE_KEY&&event.key!==null) return;
  try {
    if(store.remoteChanged()) {
      status='conflict';
      remote=true;
      paintStatus();
      if(screen==='campaigns') paintBackup();
    }
  } catch {
    status='unavailable';
    paintStatus();
  }
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&changeSerial!==writtenSerial) void saveNow();
});
window.addEventListener('beforeunload',event=>{
  if(changeSerial===writtenSerial||status==='recovery'&&!entry()) return;
  event.preventDefault();
  event.returnValue='';
});
refresh(entry()?recoverPreview('resume'):'campaigns');

return {};
}
};
const cache=Object.create(null);
function require(file) { return cache[file] ??= modules[file](require); }
require('ui.js');
})();
</script>
