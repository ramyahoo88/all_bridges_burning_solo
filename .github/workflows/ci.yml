name: Verify companion

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check exact build, rules and saves
        run: npm test
      - name: Check seeded campaign consistency
        run: node test/stress.mjs 48
      - name: Install Chromium for interface tests
        run: |
          python3 -m venv "$RUNNER_TEMP/abb-browser"
          "$RUNNER_TEMP/abb-browser/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/abb-browser/bin/python" -m playwright install --with-deps --only-shell chromium
      - name: Exercise the delivered HTML offline
        run: '"$RUNNER_TEMP/abb-browser/bin/python" -B test/browser.py'
